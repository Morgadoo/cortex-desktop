<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f5f1ff 0%, #ffffff 45%, #fff8ee 100%);
      color: #1a1a1a;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(55, 37, 128, 0.1);
      padding: 48px 40px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .logo {
      margin: 0 auto 28px;
    }

    .logo svg {
      width: 64px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .status {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .status.success {
      background: #ecfdf3;
      color: #16a34a;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
    }

    .status svg {
      width: 24px;
      height: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #111;
      margin-bottom: 10px;
    }

    .message {
      font-size: 15px;
      line-height: 1.55;
      color: #555;
    }

    .detail {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #888;
      word-break: break-word;
    }

    .hint {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    {{LOGO}}
    <div class="status {{STATUS}}">{{ICON}}</div>
    <h1>{{HEADING}}</h1>
    <p class="message">{{MESSAGE}}</p>
    {{DETAIL}}
    <p class="hint">You can close this tab and return to Cortex.</p>
  </div>
</body>
</html>
