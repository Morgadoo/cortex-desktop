[package]
name = "cortex-sandbox"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The WebAssembly sandbox that runs the tools Cortex's assistant writes."

[dependencies]
reqwest = "0.13.4"
serde = { workspace = true }
sha2 = { workspace = true }
# The seeded generator a deterministic run gives the guest, of the version wasmtime-wasi takes.
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "rt", "time"] }
url = { workspace = true }
wasmtime = "50"
wasmtime-wasi = "50"

[target.'cfg(unix)'.dependencies]
# openat with O_NOFOLLOW: workspace files are reached without following a link.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
