[package]
name = "js-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "The JavaScript interpreter that runs tools Cortex's assistant writes, as a WebAssembly component."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
boa_engine = { version = "0.22", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Built on its own, for wasm32-wasip2; not part of the app's crate.
[workspace]
