[package]
name = "cortex-traces"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Run traces, feedback and the artifact registry, in SQLite: measurements only."

[dependencies]
chrono = { workspace = true }
log = { workspace = true }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
