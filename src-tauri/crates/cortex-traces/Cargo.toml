[package]
name = "cortex-traces"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Run traces, feedback and the artifact registry, in SQLite: measurements only."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.28"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.18.0"
