[package]
name = "cortex-kernel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The agent kernel's functional core: approval policy, context, prompt, privacy, evals, lifecycle."

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
cortex-traces = { workspace = true }
regex = { workspace = true }
rig-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { version = "12.0.1", optional = true, features = ["chrono-impl"] }

[features]
# TypeScript declarations of the types the window receives (scripts/generate-types.sh).
typescript = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
