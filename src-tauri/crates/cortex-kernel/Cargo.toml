[package]
name = "cortex-kernel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The agent kernel's functional core: approval policy, context, prompt, privacy, evals, lifecycle."

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4", features = ["serde"] }
cortex-traces = { path = "../cortex-traces" }
regex = "1"
rig-core = { version = "0.46", default-features = false }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
