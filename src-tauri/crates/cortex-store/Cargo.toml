[package]
name = "cortex-store"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Cortex's files on disk: conversations and their index, backups and trash, version history, settings files written atomically, encryption at rest, and their errors."

[dependencies]
chacha20poly1305 = "0.10.1"
chrono = { workspace = true }
cortex-kernel = { workspace = true }
log = { workspace = true }
rand = "0.9.5"
rig-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { version = "12.0.1", optional = true, features = ["chrono-impl"] }
walkdir = "2.5.0"

[features]
# TypeScript declarations of the types the window receives (scripts/generate-types.sh).
typescript = ["dep:ts-rs", "cortex-kernel/typescript"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
