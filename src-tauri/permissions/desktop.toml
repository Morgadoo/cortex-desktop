[[permission]]
identifier = "allow-get-app-settings"
description = "Read desktop app settings."
commands.allow = ["get_app_settings"]

[[permission]]
identifier = "allow-reset-local-configuration"
description = "Reset the active account's file-based configuration and secrets, then restart."
commands.allow = ["reset_local_configuration"]

[[permission]]
identifier = "allow-save-app-settings"
description = "Save desktop app settings."
commands.allow = ["save_app_settings"]

[[permission]]
identifier = "allow-close-settings-window"
description = "Return to the main app from settings."
commands.allow = ["close_settings_window"]

[[permission]]
identifier = "allow-open-settings-window"
description = "Open the settings page from the main app."
commands.allow = ["open_settings_window"]

[[permission]]
identifier = "allow-take-pending-settings-tab"
description = "Read and clear the tab the settings page was asked to open on."
commands.allow = ["take_pending_settings_tab"]

[[permission]]
identifier = "allow-report-web-theme"
description = "Report whether the web app is rendering in light or dark mode."
commands.allow = ["report_web_theme"]

[[permission]]
identifier = "allow-get-web-theme"
description = "Read the web app's light or dark mode so bundled pages can match it."
commands.allow = ["get_web_theme"]

[[permission]]
identifier = "allow-inject-search"
description = "Inject text into the main Cortex search editor."
commands.allow = ["inject_search"]

[[permission]]
identifier = "allow-take-quick-ask"
description = "Redeem the quick-ask nonce for the question it stands for, from the main webview."
commands.allow = ["take_quick_ask"]

[[permission]]
identifier = "allow-hide-search"
description = "Hide the global search overlay."
commands.allow = ["hide_search"]

[[permission]]
identifier = "allow-start-browser-login"
description = "Start browser-based sign-in from the bundled sign-in page."
commands.allow = ["start_browser_login"]

[[permission]]
identifier = "allow-set-active-account"
description = "Report which Proton account the web app is signed in as."
commands.allow = ["set_active_account"]

[[permission]]
identifier = "allow-clear-active-account"
description = "Report that the web app is signed out."
commands.allow = ["clear_active_account"]

[[permission]]
identifier = "allow-is-account-signed-in"
description = "Check whether a Proton account is signed in."
commands.allow = ["is_account_signed_in"]

[[permission]]
identifier = "allow-desktop-feature-flags"
description = "Read desktop feature flags and report them from the main webview."
commands.allow = ["get_desktop_feature_flags", "set_desktop_feature_flags"]

[[permission]]
identifier = "allow-desktop-window-preferences"
description = "Read and save the dictation and in-app browser preferences, and run app menu actions, from the main window."
commands.allow = ["browser_prefs", "set_browser_prefs", "app_menu_action", "dictation_prefs", "set_dictation_prefs"]
