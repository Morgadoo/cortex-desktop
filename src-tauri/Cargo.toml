[workspace]
# The app, and the parts of its AI core that need neither Tauri nor a window.
members = [
    ".",
    "crates/cortex-kernel",
    "crates/cortex-retrieval",
    "crates/cortex-sandbox",
    "crates/cortex-traces",
]

# Versions of what more than one member uses, written once. Members add their own features.
[workspace.dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.28"
regex = "1"
rig-core = { version = "=0.46.0", default-features = false }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.9"
tempfile = "3.18.0"
thiserror = "2.0.12"
tokio = "1.43.0"
url = "2.5.4"
cortex-kernel = { path = "crates/cortex-kernel" }
cortex-retrieval = { path = "crates/cortex-retrieval" }
cortex-sandbox = { path = "crates/cortex-sandbox" }
cortex-traces = { path = "crates/cortex-traces" }

[workspace.lints.rust]
# objc 0.2's macros check a `cargo-clippy` feature that current rustc does not know.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[package]
name = "cortex"
version = "0.5.9"
edition = "2021"
description = "Cortex desktop app for macOS, Windows and Linux"
authors = ["Eamonn Maguire"]
license = "GPL-3.0-only"
default-run = "cortex-desktop"

[lib]
name = "cortex_lib"

[[bin]]
name = "cortex-desktop"
path = "src/main.rs"

[[bin]]
name = "test-mcp-server"
path = "src/bin/test_mcp_server.rs"
required-features = ["test-utils"]

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
semver = "1"
regex = { workspace = true }
similar = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
rig-core = { workspace = true, features = ["derive", "reqwest", "rustls", "pdf", "image", "audio"] }
tauri = { version = "^2.11.4", features = ["tray-icon", "macos-private-api", "unstable", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.4", features = ["json", "query", "form", "multipart"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "net", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# The built-in model runtime: chat models (GGUF) and Whisper run in-process, in pure Rust.
# QR codes for share links.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
parking_lot = "0.12"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
anyhow = "1.0.96"
async-trait = { workspace = true }
thiserror = { workspace = true }
walkdir = "2.5.0"
glob = "0.3.2"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
base64 = "0.22.1"
sha2 = { workspace = true }
flate2 = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tar = "0.4"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
schemars = { version = "1.0", features = ["chrono04"] }
open = "5.3.2"
url = { workspace = true }
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
# The spawner rmcp already uses; named here so its Windows job-object wrapper is reachable.
process-wrap = { version = "10.0", features = ["tokio1"] }
scraper = "0.22"
rand = "0.9.5"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-parser = "0.11.5"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
futures = "0.3"
chrono = { workspace = true }
chrono-tz = "0.10.4"
iana-time-zone = "0.1"
log = { workspace = true }
croner = "4.0.1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "debug-images", "panic", "reqwest", "rustls"] }
tauri-plugin-autostart = "^2.5.1"
tauri-plugin-deep-link = "^2"
tauri-plugin-dialog = "^2.4.0"
tauri-plugin-global-shortcut = "^2.3.0"
tauri-plugin-log = "^2.7.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "^2", features = ["deep-link"] }
tauri-plugin-updater = "^2.10.1"
rust_xlsxwriter = "0.102.0"
calamine = "0.38.0"
cortex-kernel = { workspace = true }
cortex-retrieval = { workspace = true }
cortex-sandbox = { workspace = true }
cortex-traces = { workspace = true }

[features]
test-utils = []
# The original Lumo Desktop: the main window loads the hosted Lumo web app, which talks to Rust
# through the bridges in webview/bridges/ (connectors, schedules, skills, PDF export). Off in
# the native Cortex app, which then compiles none of it.
hosted = []
# The WebDriver suite in e2e/: the bridges and their Rust side, driven through a stub page.
# CORTEX_E2E_TESTING is honoured only in builds with this feature.
e2e = ["hosted"]

[lints]
workspace = true

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6.2", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
block = "0.1"
cocoa = "0.25"
mac-usernotifications = "0.3.1"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"
notify-rust = "4.18.2"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.19"
# Pinned to the version process-wrap already pulls in, so the build keeps one copy.
windows = { version = "0.62.2", features = ["UI_Notifications", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }
rig-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }

# The built-in model runtime does heavy maths: optimized even in debug builds, at full speed in
# release builds (which are otherwise optimized for size).
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.float8]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
[profile.dev.package.byteorder]
opt-level = 3
[profile.dev.package.zerocopy]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.gemm-c32]
opt-level = 3
[profile.dev.package.gemm-c64]
opt-level = 3
[profile.dev.package.rand]
opt-level = 3
[profile.dev.package.rand_distr]
opt-level = 3
[profile.dev.package.safetensors]
opt-level = 3
[profile.release.package.candle-core]
opt-level = 3
[profile.release.package.candle-nn]
opt-level = 3
[profile.release.package.candle-transformers]
opt-level = 3
[profile.release.package.gemm-common]
opt-level = 3
[profile.release.package.gemm-f32]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
