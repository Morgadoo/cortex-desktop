name: CI

# Validates every change: the webview (types, build, translations), the Rust core (format,
# lints, unit and integration tests), and live tests against real servers and real models that
# no unit test can stand in for: Qdrant and Apache Tika as service containers, and the built-in
# chat, speech and embedding models downloaded from Hugging Face.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Compiled into the app; the public Lumo address is fine for tests.
  LUMO_URL: https://lumo.proton.me

jobs:
  webview:
    name: Webview (types, build, translations)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build:webview
      - name: Every interface string is translated
        run: npm run check:i18n
      - name: Voice (turn ends, live transcripts)
        run: npm run check:voice

  rust:
    name: Rust (format, lints, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The debug build, its test binaries and the saved cache outgrow the hosted runner's free
      # disk; toolkits this job never uses make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: cortex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app embeds the built webview, so it is built first.
      - run: npm ci && npm run build:webview
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lints
        working-directory: src-tauri
        run: cargo clippy --features test-utils --all-targets -- -D warnings
      - name: Unit and integration tests
        working-directory: src-tauri
        run: cargo test --features test-utils

  live:
    name: Live (Qdrant, Tika, built-in models)
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
      tika:
        image: apache/tika:latest
        ports:
          - 9998:9998
    env:
      CORTEX_TEST_QDRANT: http://localhost:6333
      CORTEX_TEST_TIKA: http://localhost:9998
    steps:
      # Outside the checkout, in the home folder: the model cache keeps them between runs.
      - name: Where the models and the recording go
        run: |
          echo "CORTEX_TEST_MODELS=$HOME/cortex-test-models" >> "$GITHUB_ENV"
          echo "CORTEX_FETCH_MODELS=$HOME/cortex-test-models" >> "$GITHUB_ENV"
          echo "CORTEX_TEST_WAV=$HOME/jfk.wav" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: cortex
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build:webview
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/cortex-test-models
          key: cortex-test-models-v1
      - name: Download the models (with the app's own downloader)
        working-directory: src-tauri
        run: cargo test --features test-utils --lib fetch_models_for_live_tests -- --ignored --nocapture
      - name: A speech recording (whisper.cpp's sample, "ask not what your country can do for you")
        run: curl -sSfL -o "$CORTEX_TEST_WAV" https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav
      - name: Wait for Qdrant and Tika
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:6333/collections >/dev/null && curl -sf http://localhost:9998/version >/dev/null && exit 0
            sleep 2
          done
          echo "Qdrant or Tika did not start" >&2
          exit 1
      - name: Live tests
        working-directory: src-tauri
        # One at a time: the batching test measures timing, and the models share the CPU.
        run: >-
          cargo test --features test-utils --lib -- --ignored --nocapture --test-threads=1
          a_qdrant_server a_tika_server a_downloaded padding_is_neutral waiting_requests_are_batched
