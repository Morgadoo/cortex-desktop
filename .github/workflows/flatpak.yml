# Cortex as a Flatpak (flatpak/): the Linux build's .deb, packaged on the GNOME runtime.
#
# Runs on pull requests that change the packaging, by hand (Actions → Flatpak → Run workflow), and
# from the release workflow, which attaches the bundle to the release. The bundle is kept as the
# run's `flatpak` artifact; install it with `flatpak install Cortex.flatpak`.
name: Flatpak

on:
  pull_request:
    paths:
      - flatpak/**
      - scripts/build-flatpak.sh
      - .github/workflows/flatpak.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: System libraries, and Flatpak's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev \
            flatpak flatpak-builder elfutils appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: The desktop entry and the metainfo are valid
        run: |
          desktop-file-validate flatpak/io.github.morgadoo.cortex-desktop.desktop
          appstreamcli validate --no-net flatpak/io.github.morgadoo.cortex-desktop.metainfo.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: flatpak
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Flatpak updates through Flatpak, so the build has no updater packages or signing.
      - name: The .deb
        run: npx tauri build --bundles deb
      - name: The Flatpak bundle
        run: scripts/build-flatpak.sh src-tauri/target/release/bundle/deb/*.deb Cortex.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Cortex.flatpak
          if-no-files-found: error
